apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fin-lab-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app.student1.devops12.test-danit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fin-lab-service
            port:
              number: 80
